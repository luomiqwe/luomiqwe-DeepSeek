<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DeepSeek 对话工具</title>

<!-- PDF.js：浏览器端 PDF 文本提取 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Mammoth.js：浏览器端 DOCX 解析 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<!-- KaTeX：数学公式渲染 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- Marked：Markdown 解析 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root {
    --bg: #0f0f0f; --panel: #1a1a1a; --border: #2a2a2a;
    --text: #e8e8e8; --muted: #888; --accent: #4a9eff;
    --user-bg: #1e3a5f; --bot-bg: #1a1a1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .topbar h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
  .topbar button {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .topbar button:active { background: var(--border); }

  /* 标签栏 */
  .tabs {
    display: flex; gap: 0; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 12px 20px; font-size: 14px; color: var(--muted);
    border: none; background: none; cursor: pointer;
    white-space: nowrap; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* 内容区 */
  .panel { flex: 1; overflow: hidden; display: none; flex-direction: column; }
  .panel.active { display: flex; }

  /* 聊天区 */
  #messages {
    flex: 1; overflow-y: auto; padding: 12px;
    -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 16px;
    line-height: 1.5; font-size: 15px; word-wrap: break-word;
    animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
  .msg.user { align-self: flex-end; background: var(--user-bg); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; max-width: 100%; }
  .msg.bot img { max-width: 100%; border-radius: 8px; margin-top: 6px; }
  .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }

  /* Markdown 内容样式 */
  .msg p, .output p { margin: 0 0 8px 0; }
  .msg p:last-child, .output p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol, .output ul, .output ol { margin: 6px 0; padding-left: 20px; }
  .msg li, .output li { margin-bottom: 4px; }
  .msg pre, .output pre { background: #0a0a0a; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  .msg code, .output code { font-family: "SF Mono", Menlo, monospace; font-size: 13px; background: #0a0a0a; padding: 2px 5px; border-radius: 4px; }
  .msg pre code, .output pre code { padding: 0; background: none; }
  .msg table, .output table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .msg th, .msg td, .output th, .output td { border: 1px solid var(--border); padding: 6px 8px; text-align: center; }
  .msg th, .output th { background: #0a0a0a; font-weight: 600; }
  .msg h1, .msg h2, .msg h3, .msg h4, .output h1, .output h2, .output h3, .output h4 { margin: 12px 0 6px; font-size: 15px; }
  .msg hr, .output hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

  /* 输入区 */
  .input-bar {
    display: flex; gap: 8px; padding: 10px 12px; background: var(--panel);
    border-top: 1px solid var(--border); flex-shrink: 0; align-items: flex-end;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .input-bar textarea {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 20px; padding: 10px 16px;
    font-size: 15px; resize: none; max-height: 120px; outline: none;
    font-family: inherit; line-height: 1.4;
  }
  .input-bar textarea:focus { border-color: var(--accent); }
  .input-bar button {
    background: var(--accent); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%; font-size: 18px;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .input-bar button:disabled { opacity: .4; }
  .attach-btn { background: none !important; border: 1px solid var(--border) !important;
    color: var(--text) !important; font-size: 20px !important; }

  /* 通用面板样式 */
  .pane {
    flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  .card p { margin: 0 0 12px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .btn {
    background: var(--accent); border: none; color: #fff;
    padding: 10px 18px; border-radius: 10px; font-size: 14px;
    cursor: pointer; width: 100%; font-weight: 500;
  }
  .btn:active { opacity: .8; }
  .btn:disabled { opacity: .4; }
  .btn.sec { background: var(--border); color: var(--text); }
  input[type=text], input[type=password], select, textarea.field {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 10px 12px;
    font-size: 15px; outline: none; font-family: inherit; margin-bottom: 10px;
  }
  input:focus, select:focus, textarea.field:focus { border-color: var(--accent); }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .file-drop {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 24px; text-align: center; color: var(--muted);
    font-size: 14px; cursor: pointer; margin-bottom: 12px;
  }
  .file-drop:active { border-color: var(--accent); }
  .file-drop input { display: none; }
  .output {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; font-size: 14px;
    line-height: 1.6; max-height: 400px; overflow-y: auto; margin-top: 12px; min-height: 60px;
  }
  .status { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .settings-overlay.show { display: flex; }
  .settings-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; width: 100%; max-width: 420px;
    max-height: 85vh; overflow-y: auto;
  }
  .settings-box h2 { margin: 0 0 16px; font-size: 18px; }
  .settings-box .row { margin-bottom: 12px; }
  .settings-box .hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: -6px; margin-bottom: 12px; }
  .img-preview { max-width: 100%; max-height: 200px; border-radius: 10px; margin: 8px 0; display: none; }
</style>
</head>
<body>
<div id="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <h1>🐋 DeepSeek</h1>
    <button onclick="clearChat()">清空</button>
    <button onclick="toggleSettings()">⚙️</button>
  </div>

  <!-- 标签 -->
  <div class="tabs">
    <button class="tab active" data-tab="chat">💬 对话</button>
    <button class="tab" data-tab="learn">📚 学习</button>
    <button class="tab" data-tab="image">🖼️ 图片</button>
    <button class="tab" data-tab="translate">🌐 翻译</button>
  </div>

  <!-- Tab 1：对话 -->
  <div class="panel active" id="panel-chat">
    <div id="messages"></div>
    <div class="input-bar">
      <button class="attach-btn" onclick="document.getElementById('chatFile').click()">＋</button>
      <input type="file" id="chatFile" accept=".pdf,.docx,.txt" style="display:none" onchange="handleChatFile(this)">
      <textarea id="chatInput" rows="1" placeholder="输入消息…"></textarea>
      <button id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
  </div>

  <!-- Tab 2：学习文本 -->
  <div class="panel" id="panel-learn">
    <div class="pane">
      <div class="card">
        <h3>📚 学习文档</h3>
        <p>上传 PDF / DOCX / TXT，AI 将提取核心要点、关键概念和学习建议。</p>
        <label class="file-drop" for="learnFile">
          <span id="learnFileLabel">点击选择文档</span>
          <input type="file" id="learnFile" accept=".pdf,.docx,.txt" onchange="updateFileLabel(this,'learnFileLabel')">
        </label>
        <button class="btn" onclick="learnDocument()">开始学习</button>
      </div>
      <div class="output" id="learnOutput"></div>
      <div class="status" id="learnStatus"></div>
    </div>
  </div>

  <!-- Tab 3：图片对话 -->
  <div class="panel" id="panel-image">
    <div class="pane">
      <div class="card">
        <h3>🖼️ 图片理解</h3>
        <p>上传图片，让 AI 描述内容、识别文字或分析图表。</p>
        <label class="file-drop" for="imageFile">
          <span id="imageFileLabel">点击选择图片</span>
          <input type="file" id="imageFile" accept="image/*" onchange="previewImage(this)">
        </label>
        <img id="imgPreview" class="img-preview">
        <textarea class="field" id="imagePrompt" rows="2" placeholder="提问，例如：描述这张图片 / 识别图中的文字">请描述这张图片的内容。</textarea>
        <button class="btn" onclick="sendImage()">发送</button>
      </div>
      <div class="output" id="imageOutput"></div>
      <div class="status" id="imageStatus"></div>
    </div>
  </div>

  <!-- Tab 4：文档翻译 -->
  <div class="panel" id="panel-translate">
    <div class="pane">
      <div class="card">
        <h3>🌐 文档翻译</h3>
        <p>上传 PDF / DOCX / TXT，整篇翻译为目标语言。大文档会自动分块处理。</p>
        <label class="file-drop" for="transFile">
          <span id="transFileLabel">点击选择文档</span>
          <input type="file" id="transFile" accept=".pdf,.docx,.txt" onchange="updateFileLabel(this,'transFileLabel')">
        </label>
        <label>目标语言</label>
        <select id="transLang">
          <option value="中文">中文</option>
          <option value="English">English</option>
          <option value="日本語">日本語</option>
          <option value="한국어">한국어</option>
          <option value="Français">Français</option>
          <option value="Deutsch">Deutsch</option>
          <option value="Español">Español</option>
        </select>
        <button class="btn" onclick="translateDoc()">开始翻译</button>
        <button class="btn sec" style="margin-top:8px" onclick="downloadTranslation()">下载译文</button>
      </div>
      <div class="output" id="transOutput"></div>
      <div class="status" id="transStatus"></div>
    </div>
  </div>

</div>

<!-- 设置弹窗 -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-box">
    <h2>⚙️ 设置</h2>
    <div class="row">
      <label>DeepSeek API Key</label>
      <input type="password" id="apiKey" placeholder="sk-…">
    </div>
    <div class="row">
      <label>API 地址（代理地址）</label>
      <input type="text" id="apiBase" placeholder="https://你的worker.workers.dev">
      <div class="hint">
        由于浏览器 CORS 限制，不能直接填 api.deepseek.com。<br>
        请填写你自己的 Cloudflare Worker 代理地址，或支持 CORS 的中转站地址。
      </div>
    </div>
    <div class="row">
      <label>文本模型</label>
      <select id="textModel">
        <option value="deepseek-v4-pro">deepseek-v4-pro（旗舰）</option>
        <option value="deepseek-v4-flash">deepseek-v4-flash（快速）</option>
      </select>
    </div>
    <div class="row">
      <label>视觉模型</label>
      <select id="visionModel">
        <option value="deepseek-flash">deepseek-flash（原生多模态）</option>
      </select>
    </div>
    <button class="btn" onclick="saveSettings()">保存</button>
    <button class="btn sec" style="margin-top:8px" onclick="toggleSettings()">关闭</button>
  </div>
</div>

<script>
// ========== 配置管理 ==========
const CFG = {
  get apiKey()    { return localStorage.getItem('ds_apiKey') || ''; },
  get apiBase()   { return localStorage.getItem('ds_apiBase') || ''; },
  get textModel() { return localStorage.getItem('ds_textModel') || 'deepseek-v4-pro'; },
  get visionModel() { return localStorage.getItem('ds_visionModel') || 'deepseek-flash'; },
  save(k, v) { localStorage.setItem('ds_' + k, v); }
};

function toggleSettings() {
  const el = document.getElementById('settingsOverlay');
  el.classList.toggle('show');
  if (el.classList.contains('show')) {
    document.getElementById('apiKey').value = CFG.apiKey;
    document.getElementById('apiBase').value = CFG.apiBase;
    document.getElementById('textModel').value = CFG.textModel;
    document.getElementById('visionModel').value = CFG.visionModel;
  }
}
function saveSettings() {
  CFG.save('apiKey', document.getElementById('apiKey').value.trim());
  CFG.save('apiBase', document.getElementById('apiBase').value.trim().replace(/\/$/, ''));
  CFG.save('textModel', document.getElementById('textModel').value);
  CFG.save('visionModel', document.getElementById('visionModel').value);
  toggleSettings();
  alert('设置已保存');
}
if (!CFG.apiKey) setTimeout(toggleSettings, 400);

// ========== 标签切换 ==========
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  };
});

// ========== 核心 API 调用 ==========
async function callAPI(messages, model, stream = false, onChunk = null) {
  const url = CFG.apiBase + '/chat/completions';
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + CFG.apiKey
    },
    body: JSON.stringify({ model, messages, stream, temperature: 0.7 })
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error('API 错误 ' + resp.status + ': ' + err.slice(0, 200));
  }
  if (!stream) {
    const data = await resp.json();
    return data.choices[0].message.content;
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed.startsWith('data:')) continue;
      const payload = trimmed.slice(5).trim();
      if (payload === '[DONE]') continue;
      try {
        const json = JSON.parse(payload);
        const delta = json.choices?.[0]?.delta?.content;
        if (delta) { full += delta; if (onChunk) onChunk(delta, full); }
      } catch (e) {}
    }
  }
  return full;
}

// ========== 渲染辅助函数（解决 LaTeX 乱码的核心） ==========
function renderContent(el, text) {
  if (!text) return;
  try {
    // 1. 预处理：将 \( ... \) 转为 $ ... $，将 \[ ... \] 转为 $$ ... $$
    // 这是关键！否则 marked 会吃掉反斜杠，导致 KaTeX 识别不到公式
    let processedText = text
      .replace(/\\\[([\s\S]*?)\\\]/g, '$$$$$1$$$$')
      .replace(/\\\(([\s\S]*?)\\\)/g, '$$$1$$');

    // 2. 使用 marked 解析 Markdown
    el.innerHTML = marked.parse(processedText);

    // 3. 使用 KaTeX 渲染数学公式
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  } catch (e) {
    el.textContent = text;
  }
}

// ========== 文件解析 ==========
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function parseFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'txt') {
    return await file.text();
  }
  if (ext === 'pdf') {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    return text;
  }
  if (ext === 'docx') {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return result.value;
  }
  throw new Error('不支持的格式：' + ext);
}

// ========== Tab 1：对话 ==========
const chatHistory = [];
let pendingFileText = '';

function addMsg(role, text) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'user') {
    div.textContent = text;
  } else {
    renderContent(div, text);
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function handleChatFile(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    pendingFileText = await parseFile(file);
    addMsg('bot', '📎 已加载文件「' + file.name + '」（' + pendingFileText.length + ' 字符）。请在消息中说明你想让我如何处理。');
  } catch (e) {
    addMsg('bot', '❌ 文件解析失败：' + e.message);
  }
  input.value = '';
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || document.getElementById('sendBtn').disabled) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  addMsg('user', text);
  chatHistory.push({ role: 'user', content: text });

  if (pendingFileText) {
    chatHistory[chatHistory.length - 1].content =
      '【文件内容】\n' + pendingFileText.slice(0, 12000) + '\n\n【用户问题】\n' + text;
    pendingFileText = '';
  }

  const botDiv = addMsg('bot', '');
  botDiv.innerHTML = '<span class="spinner"></span>思考中…';

  try {
    const messages = [{ role: 'system', content: '你是一个乐于助人的 AI 助手，回答准确、简洁。' }, ...chatHistory];
    const full = await callAPI(messages, CFG.textModel, true, (delta, f) => {
      renderContent(botDiv, f);
      document.getElementById('messages').scrollTop = 999999;
    });
    chatHistory.push({ role: 'assistant', content: full });
  } catch (e) {
    botDiv.textContent = '❌ ' + e.message;
  }
  document.getElementById('sendBtn').disabled = false;
}

function clearChat() {
  chatHistory.length = 0;
  pendingFileText = '';
  document.getElementById('messages').innerHTML = '';
}
document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ========== Tab 2：学习文本 ==========
function updateFileLabel(input, labelId) {
  const f = input.files[0];
  if (f) document.getElementById(labelId).textContent = '📄 ' + f.name;
}

async function learnDocument() {
  const file = document.getElementById('learnFile').files[0];
  const out = document.getElementById('learnOutput');
  const status = document.getElementById('learnStatus');
  if (!file) { alert('请先选择文档'); return; }
  status.innerHTML = '<span class="spinner"></span>正在解析文档…';
  out.innerHTML = '';
  try {
    const text = await parseFile(file);
    status.innerHTML = '<span class="spinner"></span>AI 正在分析…';
    const prompt = '请对以下内容进行结构化总结，包括核心要点、关键概念和学习建议：\n\n' + text.slice(0, 14000);
    const result = await callAPI([{ role: 'user', content: prompt }], CFG.textModel);
    renderContent(out, result);
    status.textContent = '✅ 完成（原文 ' + text.length + ' 字符）';
  } catch (e) {
    status.textContent = '❌ ' + e.message;
  }
}

// ========== Tab 3：图片对话 ==========
function previewImage(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('imageFileLabel').textContent = '🖼 ' + file.name;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('imgPreview');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

async function sendImage() {
  const file = document.getElementById('imageFile').files[0];
  const prompt = document.getElementById('imagePrompt').value.trim();
  const out = document.getElementById('imageOutput');
  const status = document.getElementById('imageStatus');
  if (!file) { alert('请先选择图片'); return; }
  status.innerHTML = '<span class="spinner"></span>AI 正在分析图片…';
  out.innerHTML = '';
  try {
    const b64 = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    const mime = file.type || 'image/jpeg';
    const messages = [{
      role: 'user',
      content: [
        { type: 'text', text: prompt || '请描述这张图片的内容。' },
        { type: 'image_url', image_url: { url: 'data:' + mime + ';base64,' + b64 } }
      ]
    }];
    const result = await callAPI(messages, CFG.visionModel);
    renderContent(out, result);
    status.textContent = '✅ 完成';
  } catch (e) {
    status.textContent = '❌ ' + e.message;
  }
}

// ========== Tab 4：文档翻译 ==========
let lastTranslation = '';
function chunkText(text, size) {
  const paras = text.split(/\n+/);
  const chunks = []; let cur = '';
  for (const p of paras) {
    if ((cur + p).length > size) { if (cur) chunks.push(cur); cur = p; }
    else cur += (cur ? '\n' : '') + p;
  }
  if (cur) chunks.push(cur);
  return chunks;
}

async function translateDoc() {
  const file = document.getElementById('transFile').files[0];
  const lang = document.getElementById('transLang').value;
  const out = document.getElementById('transOutput');
  const status = document.getElementById('transStatus');
  if (!file) { alert('请先选择文档'); return; }
  out.innerHTML = '';
  status.innerHTML = '<span class="spinner"></span>正在解析文档…';
  try {
    const text = await parseFile(file);
    const chunks = chunkText(text, 3000);
    status.innerHTML = '<span class="spinner"></span>翻译中… (0/' + chunks.length + ')';
    const results = [];
    for (let i = 0; i < chunks.length; i++) {
      const prompt = '请将以下内容完整翻译为' + lang + '，保持格式和语气，只输出译文：\n\n' + chunks[i];
      const r = await callAPI([{ role: 'user', content: prompt }], CFG.textModel);
      results.push(r);
      renderContent(out, results.join('\n\n'));
      status.innerHTML = '<span class="spinner"></span>翻译中… (' + (i + 1) + '/' + chunks.length + ')';
    }
    lastTranslation = results.join('\n\n');
    status.textContent = '✅ 翻译完成，共 ' + chunks.length + ' 块';
  } catch (e) {
    status.textContent = '❌ ' + e.message;
  }
}

function downloadTranslation() {
  if (!lastTranslation) { alert('请先翻译文档'); return; }
  const blob = new Blob([lastTranslation], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'translation_' + Date.now() + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
</script>
